schema = "bloom.petal.package.v1"
name = "privacy-pools"

[build]
command = "scripts/build.sh"

[source]
kind = "github"
repository = "bloom-directory/bloom-petal-privacy-pools"

[consent]
summary = "Deposit ETH into the 0xBOW Privacy Pool on Ethereum mainnet, manage encrypted note backups, prepare proofs locally, and validate, stage, and reconcile direct withdrawals through Bloom owner approval."

[caps]
allowed = ["bloom:store", "bloom:tx.outbox", "bloom:chain", "bloom:vfs.read", "bloom:private-input"]

[store]
namespaces = ["state"]
secret_namespaces = ["secrets"]