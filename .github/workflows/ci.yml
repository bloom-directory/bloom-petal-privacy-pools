name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match scripts/build.sh's PETAL_REV. This is the only place CI pins
  # the Petal CLI/SDK revision — keep the two in sync by hand until there's
  # a shared source of truth.
  PETAL_REV: 864a80b407387871bae06aabe77b91865e55f7bc

jobs:
  rust:
    name: fmt · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: route

      - name: cargo fmt
        run: cargo fmt --manifest-path route/Cargo.toml --check

      - name: cargo test
        run: cargo test --manifest-path route/Cargo.toml --locked

      - name: cargo clippy
        run: cargo clippy --manifest-path route/Cargo.toml --locked --all-targets -- -D warnings

      - name: route architecture
        run: scripts/check-route-architecture.sh

  build:
    name: petal build · check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: route

      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.254.0 --locked

      - name: Install petal CLI
        run: |
          cargo install \
            --git https://github.com/bloom-directory/petal \
            --rev "$PETAL_REV" \
            --locked \
            --root "$HOME/.petal-tool" \
            bloom-petal-cli
          echo "$HOME/.petal-tool/bin" >> "$GITHUB_PATH"
          echo "PETAL_BIN=$HOME/.petal-tool/bin/petal" >> "$GITHUB_ENV"

      - name: petal build
        # PETAL_BIN pins scripts/build.sh to the CLI installed above instead
        # of letting it silently fall back to an ambient PATH lookup.
        run: scripts/build.sh

      - name: petal check
        run: petal check --root .

      - name: petal package
        run: petal package --root . --out "$RUNNER_TEMP/privacy-pools-ci.petal.tar.gz"
